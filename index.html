<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Floraly Bloom Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --linen:#FDF4F2;
    --champagne:#F5E6E2;
    --tea-rose:#F1C8CB;
    --blossom:#F6B0BB;
    --blossom-deep:#F0919F;
    --rose:#BD5D7C;
    --rose-deep:#9C4A66;
    --sage:#7E8C69;
    --sage-soft:#AFC09C;
    --bark:#4A3540;
    --bark-soft:#8C7681;
    --raspberry:#C8154B;
    --line: rgba(74,53,64,0.14);
    --line-soft: rgba(74,53,64,0.07);
    --shadow: 0 26px 50px -26px rgba(157,90,110,0.45);
    --font-display:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --font-body:'Nunito', -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--linen);
    color:var(--bark);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ul{margin:0;padding:0;list-style:none;}
  p{margin:0;}
  h1,h2,h3,h4{margin:0;font-family:var(--font-display);color:var(--bark);}
  .container{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,56px);}
  :focus-visible{outline:2px solid var(--rose);outline-offset:3px;}

  /* ---------- eyebrow / labels ---------- */
  .eyebrow{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:400;
    font-size:1.02rem;
    color:var(--rose);
    display:inline-flex;
    align-items:center;
    gap:.6em;
  }
  .eyebrow::before{
    content:"";
    width:28px;height:1px;
    background:var(--rose);
    display:inline-block;
  }
  .kicker{
    font-family:var(--font-body);
    font-weight:700;
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--sage);
  }

  p.lead{font-size:1.08rem;line-height:1.75;color:var(--bark-soft);max-width:62ch;}
  .center{text-align:center;margin-left:auto;margin-right:auto;}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:.55rem;
    padding:.95rem 1.9rem;
    border-radius:999px;
    font-weight:700;
    font-size:.92rem;
    letter-spacing:.01em;
    border:1px solid transparent;
    text-decoration:none;
    transition:transform .25s ease, box-shadow .25s ease, background .25s ease, color .25s ease;
    white-space:nowrap;
  }
  .btn-primary{background:var(--rose);color:var(--linen);}
  .btn-primary:hover{background:var(--rose-deep);transform:translateY(-2px);box-shadow:var(--shadow);}
  .btn-outline{background:transparent;color:var(--rose);border-color:var(--rose);}
  .btn-outline:hover{background:var(--rose);color:var(--linen);transform:translateY(-2px);}
  .btn-ghost{background:transparent;color:var(--bark);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--rose);color:var(--rose);}
  .btn svg{width:16px;height:16px;flex:none;}
  .btn-row{display:flex;flex-wrap:wrap;gap:14px;}

  /* ---------- header ---------- */
  .site-header{
    position:sticky;top:0;z-index:60;
    background:rgba(250,244,238,0.86);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
  }
  .header-inner{
    display:flex;align-items:center;justify-content:space-between;
    gap:20px;padding:16px clamp(20px,5vw,56px);
    max-width:1180px;margin:0 auto;
  }
  .logo{
    text-decoration:none;
    display:flex;align-items:center;
  }
  .logo-img{height:72px;width:72px;display:block;border-radius:50%;}
  .mobile-menu-top .logo-img{height:80px;width:80px;}
  .main-nav{display:flex;align-items:center;gap:6px;}
  .nav-link{
    background:none;border:none;padding:8px 14px;
    font-size:.9rem;font-weight:600;color:var(--bark-soft);
    border-radius:999px;transition:background .2s ease,color .2s ease;
  }
  .nav-link:hover{color:var(--rose-deep);}
  .nav-link.active{background:var(--champagne);color:var(--rose-deep);}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .lang-toggle{
    display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;
    font-size:.75rem;font-weight:800;letter-spacing:.05em;
  }
  .lang-toggle button{
    background:none;border:none;padding:7px 11px;color:var(--bark-soft);
  }
  .lang-toggle button.active{background:var(--bark);color:var(--linen);}
  .hamburger{display:none;background:none;border:none;padding:8px;color:var(--bark);}
  .hamburger svg{width:24px;height:24px;}

  /* mobile menu */
  .mobile-menu{
    position:fixed;inset:0;background:var(--linen);z-index:80;
    display:flex;flex-direction:column;padding:24px clamp(20px,6vw,56px);
    transform:translateY(-8px);opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .mobile-menu.open{opacity:1;transform:translateY(0);pointer-events:auto;}
  .mobile-menu-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;}
  .mobile-menu nav{display:flex;flex-direction:column;gap:6px;}
  .mobile-menu .nav-link{
    text-align:left;font-family:var(--font-display);font-size:1.7rem;font-weight:500;
    padding:12px 4px;border-radius:0;border-bottom:1px solid var(--line-soft);color:var(--bark);
  }
  .mobile-menu .nav-link.active{background:none;color:var(--rose-deep);}
  .close-btn{background:none;border:none;color:var(--bark);}
  .close-btn svg{width:26px;height:26px;}

  /* ---------- pages / sections ---------- */
  .page{display:none;}
  .page.active{display:block;animation:pagein .5s ease both;}
  @keyframes pagein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){
    .page.active{animation:none;}
    html{scroll-behavior:auto;}
  }

  section.block{padding:clamp(56px,9vw,108px) 0;}
  .alt{background:var(--champagne);}

  /* divider */
  .divider-wrap{display:flex;justify-content:center;padding:6px 0;}
  .divider{width:min(320px,70%);height:20px;color:var(--sage-soft);}

  /* ---------- hero ---------- */
  .hero{padding:clamp(50px,8vw,88px) 0 clamp(40px,6vw,72px);}
  .hero-grid{
    display:grid;grid-template-columns:1.1fr 0.9fr;gap:clamp(30px,6vw,70px);
    align-items:center;
  }
  .hero-title{
    font-size:clamp(3.4rem,9vw,6.4rem);
    font-weight:600;
    line-height:.92;
    letter-spacing:-.01em;
    color:var(--rose-deep);
    text-wrap:balance;
    margin:14px 0 4px;
  }
  .hero-sub{
    font-family:var(--font-body);
    font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    font-size:.82rem;color:var(--sage);
  }
  .hero-tagline{
    font-family:var(--font-display);font-style:italic;font-weight:500;
    font-size:clamp(1.3rem,2.4vw,1.7rem);color:var(--bark);margin:20px 0 16px;
    text-wrap:balance;
  }
  .hero-art{position:relative;}
  .hero-art svg{width:100%;height:auto;}
  .photo-frame{
    width:100%;height:auto;display:block;object-fit:cover;
    border-radius:28px;
    box-shadow:0 26px 50px -26px rgba(157,90,110,0.5);
  }
  .hero-art .photo-frame{aspect-ratio:1/1.03;}
  .bouquet-photo-wrap .photo-frame{max-height:520px;margin:0 auto;}
  .hero-art .sway{transform-origin:bottom center;animation:sway 6s ease-in-out infinite;}
  .hero-art .sway2{animation-delay:.6s;}
  .hero-art .sway3{animation-delay:1.2s;}
  .hero-art .sway4{animation-delay:1.8s;}
  .hero-art .sway5{animation-delay:2.4s;}
  @keyframes sway{0%,100%{transform:rotate(-1.4deg);}50%{transform:rotate(1.4deg);}}
  @media (prefers-reduced-motion:reduce){.hero-art .sway{animation:none;}}

  /* ---------- occasions ---------- */
  .occ-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px;}
  .occ-card{
    border:none;border-radius:26px;background:var(--linen);
    box-shadow:0 18px 34px -26px rgba(157,90,110,0.5);
    padding:32px 20px;text-align:center;transition:transform .25s ease, box-shadow .25s ease;
  }
  .occ-card:hover{transform:translateY(-5px);box-shadow:0 24px 40px -22px rgba(157,90,110,0.55);}
  .occ-icon{
    width:56px;height:56px;margin:0 auto 16px;border-radius:50%;
    background:var(--blossom);display:flex;align-items:center;justify-content:center;
    color:var(--rose-deep);
  }
  .occ-icon svg{width:24px;height:24px;}
  .occ-label{font-family:var(--font-display);font-size:1.08rem;font-weight:500;}

  /* ---------- steps ---------- */
  .steps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:48px;position:relative;}
  .step{padding:0 22px 0 0;position:relative;}
  .step:not(:first-child){border-left:1px solid var(--line);padding-left:22px;}
  .step-n{font-family:var(--font-display);font-size:2.4rem;font-weight:300;color:var(--sage-soft);line-height:1;}
  .step h3{font-size:1.15rem;font-weight:600;margin:14px 0 8px;}
  .step p{color:var(--bark-soft);font-size:.95rem;line-height:1.6;}

  /* ---------- why list ---------- */
  .why-list{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 40px;margin-top:36px;max-width:760px;}
  .why-item{display:flex;align-items:center;gap:14px;font-family:var(--font-display);font-size:1.2rem;}
  .why-item svg{width:20px;height:20px;color:var(--sage);flex:none;}

  /* ---------- instagram ---------- */
  .ig-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:36px;}
  .ig-tile{
    aspect-ratio:1;border-radius:20px;display:flex;align-items:center;justify-content:center;
    color:rgba(46,38,33,.55);position:relative;overflow:hidden;
  }
  .ig-tile svg{width:34%;height:34%;opacity:.85;}
  .ig-note{margin-top:16px;font-size:.82rem;color:var(--bark-soft);font-style:italic;}

  /* ---------- cta banner ---------- */
  .cta-banner{background:var(--rose-deep);color:var(--linen);text-align:center;padding:clamp(56px,8vw,90px) 0;}
  .cta-banner h2{color:var(--linen);font-size:clamp(2rem,4.4vw,3rem);text-wrap:balance;}
  .cta-banner p{color:rgba(250,244,238,.85);margin:16px 0 30px;font-size:1.1rem;}
  .cta-banner .btn-primary{background:var(--linen);color:var(--rose-deep);}
  .cta-banner .btn-primary:hover{background:var(--blossom);}

  /* ---------- generic content layout ---------- */
  .page-hero{padding:clamp(56px,8vw,96px) 0 clamp(20px,4vw,40px);}
  .page-hero h1{font-size:clamp(2.4rem,5.5vw,4rem);color:var(--rose-deep);margin-top:14px;text-wrap:balance;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start;}
  .stack{display:flex;flex-direction:column;gap:22px;}

  .value-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;margin-top:44px;}
  .value-card{
    padding:28px 20px;border-radius:22px;background:var(--linen);
    box-shadow:0 16px 30px -24px rgba(157,90,110,0.5);
  }
  .value-card::before{
    content:"🌸";display:block;width:34px;height:34px;
    font-size:26px;line-height:34px;margin-bottom:16px;
  }
  .value-card h3{font-size:1.1rem;margin-bottom:10px;}
  .value-card p{font-size:.92rem;color:var(--bark-soft);line-height:1.6;}

  .mv-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:56px;}
  .mv-card{background:var(--linen);border:none;border-radius:26px;padding:38px;box-shadow:0 20px 38px -26px rgba(157,90,110,0.45);}
  .mv-card h3.kicker-title{font-family:var(--font-display);font-style:italic;font-size:1.5rem;color:var(--rose);margin-bottom:14px;font-weight:500;}
  .mv-card p{color:var(--bark-soft);line-height:1.75;}

  /* tiers */
  .tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:46px;}
  .tier-card{border:none;border-radius:26px;padding:36px 30px;background:var(--linen);box-shadow:0 20px 38px -26px rgba(157,90,110,0.45);}
  .tier-card h3{font-size:1.4rem;margin-bottom:12px;color:var(--rose-deep);}
  .tier-card p{color:var(--bark-soft);font-size:.96rem;line-height:1.65;}

  .feature-block{margin-top:60px;padding-top:50px;border-top:1px solid var(--line);}
  .feature-block .flabel{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
  .chip-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}
  .chip{
    border:none;border-radius:999px;padding:10px 20px;font-size:.88rem;
    font-weight:700;color:var(--rose-deep);background:var(--tea-rose);
  }
  .check-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 30px;margin-top:22px;}
  .check-item{display:flex;gap:10px;align-items:flex-start;font-size:.96rem;color:var(--bark-soft);}
  .check-item svg{width:17px;height:17px;color:var(--sage);flex:none;margin-top:3px;}

  /* private / corporate occasion pills */
  .pill-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px;}
  .pill{
    font-family:var(--font-display);font-style:italic;font-size:1.05rem;
    border:1px solid var(--rose);color:var(--rose-deep);
    border-radius:999px;padding:10px 22px;background:var(--blossom);
    background:color-mix(in srgb, var(--blossom) 45%, transparent);
  }

  .brand-box{
    margin-top:56px;border:none;border-radius:28px;
    padding:44px;text-align:center;background:var(--champagne);
    box-shadow:0 20px 38px -28px rgba(157,90,110,0.4);
  }
  .brand-box h3{font-size:1.5rem;letter-spacing:.02em;}
  .brand-box .chip-list{justify-content:center;}

  /* about */
  .founders-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:40px;margin-top:50px;}
  .founder-card{text-align:center;}
  .founder-photo{
    width:150px;height:150px;border-radius:50%;margin:0 auto 20px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:2.6rem;color:var(--linen);
  }
  .founder-card h3{font-size:1.3rem;margin-bottom:6px;}
  .founder-card p{color:var(--bark-soft);font-size:.94rem;font-style:italic;}

  /* contact / form */
  .contact-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:60px;align-items:start;}
  fieldset{border:none;padding:0;margin:0 0 34px;}
  legend{
    font-family:var(--font-display);font-style:italic;color:var(--rose);
    font-size:1.1rem;padding:0 0 14px;width:100%;border-bottom:1px solid var(--line);margin-bottom:18px;
  }
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;}
  .field{display:flex;flex-direction:column;gap:6px;position:relative;}
  .field.full{grid-column:1 / -1;}
  label{font-size:.78rem;font-weight:700;letter-spacing:.03em;color:var(--bark-soft);}
  input,select,textarea{
    font-family:var(--font-body);font-size:.98rem;color:var(--bark);
    border:none;border-bottom:1px solid var(--line);background:transparent;
    padding:9px 2px;transition:border-color .2s ease;width:100%;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--rose);outline:none;}
  textarea{resize:vertical;min-height:96px;}

  /* ---------- calendar picker ---------- */
  .date-input-wrap{position:relative;}
  .date-input-wrap input{cursor:pointer;padding-right:22px;}
  .date-icon{
    position:absolute;right:2px;top:9px;width:16px;height:16px;color:var(--rose);pointer-events:none;
  }
  .date-icon svg{width:100%;height:100%;display:block;}
  .calendar-pop{
    position:absolute;top:calc(100% + 10px);left:0;z-index:70;
    width:290px;background:var(--linen);border-radius:22px;padding:18px;
    box-shadow:0 24px 44px -20px rgba(157,90,110,0.55);
  }
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-head .cal-label{font-family:var(--font-display);font-size:1.15rem;color:var(--rose-deep);font-weight:600;}
  .cal-nav{background:var(--tea-rose);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--rose-deep);}
  .cal-nav svg{width:14px;height:14px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .cal-dow{font-size:.68rem;font-weight:800;color:var(--bark-soft);text-transform:uppercase;padding-bottom:6px;}
  .cal-day{
    border:none;background:none;border-radius:50%;width:32px;height:32px;font-size:.85rem;
    color:var(--bark);cursor:pointer;justify-self:center;
  }
  .cal-day:hover{background:var(--tea-rose);}
  .cal-day.muted{color:var(--line);}
  .cal-day.today{font-weight:800;color:var(--rose);}
  .cal-day.selected{background:var(--rose);color:var(--linen);font-weight:700;}
  .choice-row{display:flex;flex-wrap:wrap;gap:10px;}
  .choice{
    border:1.5px solid var(--tea-rose);border-radius:999px;padding:9px 18px;font-size:.85rem;
    font-weight:700;color:var(--rose-deep);cursor:pointer;transition:all .2s ease;background:var(--linen);
  }
  .choice input{position:absolute;opacity:0;pointer-events:none;}
  .choice:has(input:checked){background:var(--rose);border-color:var(--rose);color:var(--linen);}
  .pkg-wrap{margin-top:22px;transition:opacity .25s ease;}
  .pkg-label{font-size:.92rem;font-weight:700;color:var(--bark);margin-bottom:12px;display:block;}
  .form-note{font-size:.8rem;color:var(--bark-soft);font-style:italic;margin-top:14px;}
  .form-success{
    display:none;margin-top:20px;padding:16px 22px;border-radius:18px;
    background:var(--sage-soft);color:#fff;font-weight:700;font-size:.92rem;
  }
  .form-success.show{display:block;}
  .form-error{
    display:none;margin-top:20px;padding:16px 22px;border-radius:18px;
    background:var(--raspberry);color:#fff;font-weight:700;font-size:.92rem;
  }
  .form-error.show{display:block;}

  .faq-list{margin-top:20px;display:flex;flex-direction:column;gap:12px;}
  .faq-item{background:var(--linen);border-radius:18px;padding:2px 22px;box-shadow:0 12px 26px -22px rgba(157,90,110,0.45);}
  .faq-q{
    width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;
    background:none;border:none;text-align:left;padding:18px 0;
    font-family:var(--font-display);font-size:1.1rem;color:var(--bark);
  }
  .faq-q .mark{font-size:1.4rem;color:var(--rose);flex:none;transition:transform .25s ease;}
  .faq-item.open .mark{transform:rotate(45deg);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .faq-a p{padding:0 0 20px;color:var(--bark-soft);font-size:.95rem;line-height:1.65;max-width:70ch;}

  .contact-side{background:var(--champagne);border-radius:26px;padding:34px;}
  .contact-side .eyebrow{margin-bottom:14px;}
  .contact-side h3{font-size:1.5rem;margin-bottom:16px;}
  .contact-side .cline{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;font-size:.94rem;color:var(--bark-soft);}
  .contact-side .cline svg{width:18px;height:18px;color:var(--rose);flex:none;margin-top:2px;}

  /* footer */
  .site-footer{background:var(--bark);color:var(--champagne);padding:60px 0 26px;}
  .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px;}
  .footer-grid h4{color:var(--linen);font-family:var(--font-body);font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:16px;}
  .footer-logo{font-family:var(--font-display);font-size:1.6rem;color:var(--linen);}
  .footer-tagline{font-style:italic;font-family:var(--font-display);color:var(--blossom);margin-top:10px;font-size:1.05rem;}
  .footer-links button{background:none;border:none;color:rgba(238,226,219,.75);padding:5px 0;font-size:.92rem;display:block;}
  .footer-links button:hover{color:var(--blossom);}
  .footer-bottom{
    margin-top:46px;padding-top:22px;border-top:1px solid rgba(238,226,219,.15);

  /* ============ STATE ============ */
  var state = { lang:"fr", page:"home" };
  var calState = { viewDate:new Date(), selectedDate:null };
  var livePackages = null;

  function getTiersData(lang){
    if(livePackages && livePackages.length){
      return livePackages.map(function(p){
        return {
          name: lang==='fr' ? p.name_fr : p.name_en,
          tagline: lang==='fr' ? p.tagline_fr : p.tagline_en,
          badge: (lang==='fr' ? p.badge_fr : p.badge_en) || '',
          text: lang==='fr' ? p.text_fr : p.text_en,
          list: (lang==='fr' ? p.features_fr : p.features_en) || [],
          minimum: lang==='fr' ? p.minimum_fr : p.minimum_en,
          price: lang==='fr' ? p.price_fr : p.price_en
        };
      });
    }
    return CONTENT[lang].experiences.tiers;
  }

  function fetchPackages(){
    if(!sbClient) return;
    sbClient.from('packages').select('*').eq('active', true).order('sort_order', {ascending:true})
      .then(function(res){
        if(res && !res.error && res.data && res.data.length){
          livePackages = res.data;
          if(state.page === 'experiences' || state.page === 'contact'){ renderAll(); }
        }
      })
      .catch(function(err){ console.error('Supabase packages fetch error:', err); });
  }

    var locale = calLocale();
    var y = viewDate.getFullYear(), m = viewDate.getMonth();
    var monthLabel = new Intl.DateTimeFormat(locale,{month:'long',year:'numeric'}).format(viewDate);
    monthLabel = monthLabel.charAt(0).toUpperCase() + monthLabel.slice(1);
    var firstOfMonth = new Date(y,m,1);
    var startOffset = (firstOfMonth.getDay() + 6) % 7; /* Monday-first grid */
    var daysInMonth = new Date(y,m+1,0).getDate();
    var daysInPrevMonth = new Date(y,m,0).getDate();
    var today = new Date();
    var dowFmt = new Intl.DateTimeFormat(locale,{weekday:'narrow'});
    var html = '<div class="cal-head">';
    html += '<button type="button" class="cal-nav" data-cal-nav="-1">'+icon('chevL')+'</button>';
    html += '<span class="cal-label">'+monthLabel+'</span>';
    html += '<button type="button" class="cal-nav" data-cal-nav="1">'+icon('chevR')+'</button>';
    html += '</div><div class="cal-grid">';
    for(var d=0; d<7; d++){
      var refDay = new Date(2024,0,1+d); /* a known Monday */
      html += '<div class="cal-dow">'+dowFmt.format(refDay)+'</div>';
    }
    for(var i=0;i<startOffset;i++){
      var pd = daysInPrevMonth - startOffset + 1 + i;
      html += '<button type="button" class="cal-day muted" disabled>'+pd+'</button>';
    }
    for(var day=1; day<=daysInMonth; day++){
      var cellDate = new Date(y,m,day);
      var cls = 'cal-day';
      if(cellDate.toDateString() === today.toDateString()) cls += ' today';
      if(calState.selectedDate && cellDate.toDateString() === calState.selectedDate.toDateString()) cls += ' selected';
      html += '<button type="button" class="'+cls+'" data-cal-day="'+day+'">'+day+'</button>';
    }
    var totalCells = startOffset + daysInMonth;
    var trailing = (7 - (totalCells % 7)) % 7;
    for(var t=1; t<=trailing; t++){
      html += '<button type="button" class="cal-day muted" disabled>'+t+'</button>';
    }
    html += '</div>';
    return html;
  }

    document.getElementById('mobileLogoImg').src = logoSrc;
    document.getElementById('headerBookBtn').textContent = t.nav.book;
    renderNav(document.getElementById('mainNav'), t, false);
    renderNav(document.getElementById('mobileNav'), t, true);
    NAV_ORDER.forEach(function(p){
      document.getElementById('page-'+p).innerHTML = RENDERERS[p](t);
    });
    renderFooter(t);
    document.querySelectorAll('.lang-toggle button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-lang')===state.lang);
    });
    showPage(state.page, true);
  }

  function showPage(page, skipScroll){
    if(!RENDERERS[page]) page = 'home';
    state.page = page;
    document.querySelectorAll('.page').forEach(function(s){
      s.classList.toggle('active', s.getAttribute('data-page')===page);
    });
    document.querySelectorAll('.nav-link').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-nav')===page);
    });
    document.title = CONTENT[state.lang].nav[page] + ' · FLORALY';
    if(!skipScroll){ window.scrollTo({top:0, behavior:'auto'}); }
    closeMobileMenu();
  }

  function openMobileMenu(){ document.getElementById('mobileMenu').classList.add('open'); }
  function closeMobileMenu(){ document.getElementById('mobileMenu').classList.remove('open'); }

  /* ============ EVENTS ============ */
  document.addEventListener('click', function(e){
    var navBtn = e.target.closest('[data-nav]');
    if(navBtn){
      e.preventDefault();
      showPage(navBtn.getAttribute('data-nav'));
      return;
    }
    var scrollBtn = e.target.closest('[data-scroll]');
    if(scrollBtn){
      var target = document.getElementById(scrollBtn.getAttribute('data-scroll'));
      if(target){ target.scrollIntoView({behavior:'smooth', block:'start'}); }
      return;
    }
    var langBtn = e.target.closest('[data-lang]');
    if(langBtn){
      state.lang = langBtn.getAttribute('data-lang');
      renderAll();
      return;
    }
    if(e.target.closest('#hamburgerBtn')){ openMobileMenu(); return; }
    if(e.target.closest('#closeMenuBtn')){ closeMobileMenu(); return; }

    var dateInput = e.target.closest('#edateInput');
    if(dateInput){
      var already = document.getElementById('calendarPop');
      if(already){ closeCalendar(); } else { openCalendar(dateInput); }
      return;
    }
    var calNav = e.target.closest('.cal-nav');
    if(calNav){
      var dir = parseInt(calNav.getAttribute('data-cal-nav'),10);
      calState.viewDate = new Date(calState.viewDate.getFullYear(), calState.viewDate.getMonth()+dir, 1);
      refreshCalendar();
      return;
    }
    var calDay = e.target.closest('.cal-day:not(.muted)');
    if(calDay){
      var dayNum = parseInt(calDay.getAttribute('data-cal-day'),10);
      var picked = new Date(calState.viewDate.getFullYear(), calState.viewDate.getMonth(), dayNum);
      calState.selectedDate = picked;
      var input = document.getElementById('edateInput');
      if(input){
        input.value = new Intl.DateTimeFormat(calLocale(),{day:'numeric',month:'long',year:'numeric'}).format(picked);
      }
      closeCalendar();
      return;
    }
    if(!e.target.closest('.date-input-wrap')){ closeCalendar(); }

    var faqQ = e.target.closest('.faq-q');
    if(faqQ){
      var item = faqQ.closest('.faq-item');
      var panel = item.querySelector('.faq-a');
      var isOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item.open').forEach(function(o){
        o.classList.remove('open');
        o.querySelector('.faq-a').style.maxHeight = null;
      });
      if(!isOpen){
        item.classList.add('open');
        panel.style.maxHeight = panel.scrollHeight + 'px';
      }
      return;
    }
  });

  document.addEventListener('change', function(e){
    if(e.target && e.target.name === 'expType'){
      var wrap = document.getElementById('pkgWrap');
      if(wrap){ wrap.innerHTML = buildPkgHTML(CONTENT[state.lang].contact, e.target.value); }
    }
  });

  document.addEventListener('submit', function(e){
    if(e.target && e.target.id === 'contactForm'){
      e.preventDefault();
      var form = e.target;
      var success = document.getElementById('formSuccess');
      var errorEl = document.getElementById('formError');
      var submitBtn = form.querySelector('button[type="submit"]');
      var fd = new FormData(form);
      var payload = {
        first_name: fd.get('fname') || '',
        last_name: fd.get('lname') || '',
        email: fd.get('email') || '',
        phone: fd.get('phone') || '',
        event_type: [fd.get('expType'), fd.get('etype')].filter(Boolean).join(' — '),
        package: fd.get('package') || '',
        event_date: fd.get('edate') || '',
        location: fd.get('eplace') || '',
        guests: fd.get('eguests') || '',
        vision: fd.get('vision') || '',
        heard_about: fd.get('heard') || ''
      };
      if(success){ success.classList.remove('show'); }
      if(errorEl){ errorEl.classList.remove('show'); }
      if(!sbClient){
        if(errorEl){ errorEl.classList.add('show'); }
        return;
      }
      if(submitBtn){ submitBtn.disabled = true; }
      sbClient.from('submissions').insert([payload]).then(function(res){
        if(submitBtn){ submitBtn.disabled = false; }
        if(res && res.error){
          console.error('Supabase insert error:', res.error);
          if(errorEl){ errorEl.classList.add('show'); }
          return;
        }
        if(success){ success.classList.add('show'); }
        form.querySelectorAll('input[type="text"],input[type="email"],input[type="tel"],input[type="number"],textarea').forEach(function(el){ el.value=''; });
        calState.selectedDate = null;
        closeCalendar();
      }).catch(function(err){
        if(submitBtn){ submitBtn.disabled = false; }
        console.error('Supabase insert exception:', err);
        if(errorEl){ errorEl.classList.add('show'); }
      });
    }
  });

  window.addEventListener('hashchange', function(){
    var p = location.hash.replace('#','');
    if(RENDERERS[p]) showPage(p);
  });

  /* ============ INIT ============ */
  var initialPage = location.hash.replace('#','');
  if(RENDERERS[initialPage]) state.page = initialPage;
  renderAll();
  fetchPackages();
})();
</script>
</body>
</html>
